name: Installer page

# Deploys the installer page (installer/) together with the latest release's build files to GitHub Pages.
# Since 0.2.0 (Renut on deko3d) the shaders are inside the NRO, so the page needs no WebAssembly shader tools and nothing is built here.
# The release must carry bakugan.nro, deko3d_shaders.bin and pipeline_list.bin (loose, or inside the SD card zip); bakugan.toml.example is optional (0.2.1+).
#
# One-time setup: Settings > Pages > Source: "GitHub Actions".
#
on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - '.github/workflows/installer.yml'
  # A new release redeploys the page through .github/workflows/release-redeploy.yml (a run started by a release tag is not
  # allowed to deploy to the github-pages environment, which only accepts main).
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release to serve (empty selects the most recent published release, including prereleases)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release-assets
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft == false)][0].tag_name // empty')
          fi
          test -n "$tag" || { echo '::error::Publish a release with bakugan.nro before deploying'; exit 1; }
          gh release download "$tag" --pattern '*.nro' --pattern 'deko3d_shaders.bin' --pattern 'pipeline_list.bin' --pattern 'bakugan.toml.example' --pattern '*.zip' --dir release-assets
          # The release may carry the SD card zip instead of the loose files: take the build files from it.
          python3 - <<'PY'
          import glob, os, zipfile
          d = 'release-assets'
          wanted = ('bakugan.nro', 'deko3d_shaders.bin', 'pipeline_list.bin', 'bakugan.toml.example')
          for z in glob.glob(os.path.join(d, '*.zip')):
              with zipfile.ZipFile(z) as zf:
                  for name in zf.namelist():
                      base = os.path.basename(name)
                      if base in wanted and not os.path.exists(os.path.join(d, base)):
                          with open(os.path.join(d, base), 'wb') as out:
                              out.write(zf.read(name))
                          print('took', base, 'from', os.path.basename(z))
              os.remove(z)
          PY
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Stage a complete site
        run: bash installer/tools/stage_site.sh _site --releases release-assets --require-complete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
