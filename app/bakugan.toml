# Settings read at startup (ReXGlue cvars). The build copies this file next to the executable when there is none
# there yet; edit the copy. Any cvar can also be given on the command line (--name=value) or as REX_<NAME>.

# Retail disc game: the full version.
license_mask = 1

# GPU: the emulated Xenos GPU (D3D12 on Windows).
gpu_plugin = "xenos"

log_level = "info"

# Normal play: a window with sound. The test harness (tools/win/boot_test.ps1) forces both of these (muted and
# minimized) through the environment, so automated runs never take over the desktop or the speakers.
audio_mute = false
window_start_minimized = false
