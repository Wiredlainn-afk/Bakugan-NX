# Clean CPU profile: the release configuration (built-in defaults: dynamic scale, CAS, native renderer) plus the stack
# sampler and numbered logs. No GPU marks, no pair report, no per-draw log, no render-height pinning, so the ring
# thread's cost is what a player gets (plus the sampler itself).
log_level = "info"
log_to_file = true
log_single_file = false
bakugan_shader_misses = "shader_dump"
switch_profile_report = true
switch_profile_stacks = true
