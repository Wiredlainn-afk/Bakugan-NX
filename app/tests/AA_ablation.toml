# Debug settings for hardware testing (the built-in defaults have logging off). Keys here override the NRO's defaults.
log_level = "info"
log_to_file = true
asset_pack = false
asset_pack_build = false
input_xbox_layout = false
input_joycon_sideways = true
bakugan_shader_misses = "shader_dump"
switch_profile_stacks = false
switch_profile_report = true
sa2_io_trace = 0
bakugan_native_conversion_frag = true

# Dynamic render scale (performance-fidelity branch): steps the render height down by 180 px while the GPU is the
# limit (handheld: 720 -> 540, docked: 1080 -> 720) and back up with headroom. Look for "[res] dynamic:" in the log.

# Ablation test (water arena battle, ~2.5 min): skips groups of vertex shaders in turn (12 s each, baseline between)
# and logs "[ablate] phase ..." lines with fps and GPU ms per frame. Fixed 540p so the numbers compare.
bakugan_render_dynamic = false
# Starting the game AT 540 hung the console twice: it starts at 720 and is held at 540 from 45 s on.
bakugan_render_force_after_s = 45
bakugan_render_force_height_handheld = 540
bakugan_ablate_arm_ms = 20
bakugan_ablate_phase_s = 12
bakugan_ablate_vs_groups = "744,1082;779;800;121;1813;1135"

# development runs keep one numbered log per run (the release default is one replaced file)
log_single_file = false
